<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="1150" viewBox="0 0 1000 1150"
     role="img" aria-labelledby="title desc">
  <title id="title">Navira Shop Primary Logo</title>
  <desc id="desc">Navira N symbol in sage and peach with coral heart, NAVIRA wordmark and Shop.ir subtitle.</desc>

  <!-- Transparent background -->

  <defs>
    <style>
      .wordmark {
        font-family: Manrope, Arial, sans-serif;
        font-size: 84px;
        font-weight: 500;
        letter-spacing: 22px;
        fill: #573F35;
      }
      .submark {
        font-family: Manrope, Arial, sans-serif;
        font-size: 46px;
        font-weight: 400;
        letter-spacing: 8px;
        fill: #776259;
      }
    </style>
  </defs>

  <!-- NAVIRA SYMBOL -->
  <g id="navira-symbol" transform="translate(0,20)">
    <!-- Left / Sage -->
    <path fill="#C4D5C0"
      d="
        M 165 315
        C 165 270, 195 245, 245 245
        C 360 245, 450 300, 505 420
        C 540 495, 555 590, 562 655
        L 410 500
        L 410 710
        C 410 810, 345 865, 245 865
        C 195 865, 165 840, 165 795
        Z" />

    <!-- Right / Peach -->
    <path fill="#F7D2B5"
      d="
        M 565 455
        C 610 360, 685 300, 780 265
        C 818 250, 845 272, 845 310
        L 845 755
        C 845 830, 798 865, 720 865
        C 615 865, 545 800, 520 705
        C 495 610, 515 555, 565 455
        Z" />

    <!-- Heart / Coral -->
    <path fill="#EEA2A5"
      d="
        M 505 195
        C 505 148, 542 118, 585 118
        C 620 118, 649 139, 665 166
        C 681 139, 710 118, 745 118
        C 788 118, 825 148, 825 195
        C 825 260, 766 306, 665 371
        C 564 306, 505 260, 505 195
        Z" />
  </g>

  <!-- WORDMARK -->
  <text x="500" y="1010" text-anchor="middle" class="wordmark">NAVIRA</text>
  <text x="500" y="1082" text-anchor="middle" class="submark">Shop.ir</text>
</svg>
